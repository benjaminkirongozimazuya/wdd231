<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite Express - Eateries Directory</title>
    <meta name="description" content="Browse the complete list of our partner restaurants and takeaway options on QuickBite Express.">
    <meta name="author" content="Benjamin Kirongozi Mazuya">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="images/quickbitelogo.png" type="image/x-icon">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css" media="(min-width: 768px)">
    <link rel="stylesheet" href="styles/modal.css">

    <!-- JavaScript ES Module -->
    <script type="module" src="scripts/main.js" defer></script>
</head>
<body>
    <!-- Site Header -->
    <header>
        <div class="logo-container">
            <img src="images/quickbitelogo.png" alt="QuickBite Express Logo" width="50" height="50" loading="lazy">
            <span class="site-title">QuickBite Express</span>
        </div>
        <button id="menu-button" aria-label="Open navigation menu">&#9776;</button>
        <nav>
            <ul id="menu-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html" class="active">Directory</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="directory-header">
            <h1>Partner Eateries Directory</h1>
            <p>Discover all our listed independent restaurants and find your next favorite takeaway dish.</p>
        </section>

        <!-- Dynamically generated container via JavaScript (15+ items) -->
        <section id="eatery-container" class="eatery-grid">
            <!-- Restaurant cards will be injected here via JavaScript -->
        </section>
    </main>

    <!-- Modal Dialog -->
    <dialog id="details-modal">
        <div class="modal-content">
            <button id="close-modal" aria-label="Close modal">&times;</button>
            <div id="modal-body">
                <!-- Details injected dynamically -->
            </div>
        </div>
    </dialog>

    <!-- Footer -->
    <footer>
        <p>&copy; <span id="current-year">2026</span> QuickBite Express. All rights reserved.</p>
        <p><a href="attributions.html">Source and Image Attributions</a></p>
        <div class="social-icons">
            <a href="#" aria-label="Facebook">🌐</a>
            <a href="#" aria-label="Twitter">🐦</a>
            <a href="#" aria-label="Instagram">📸</a>
        </div>
    </footer>
</body>
</html>
